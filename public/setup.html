<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sounder Account Setup</title><link rel="stylesheet" href="/admin.css"></head><body><main class="login-screen"><section class="login-card"><div class="login-mark">S</div><h1>Set your Sounder logins</h1><p>This private setup link works once. Choose separate administrator and shared crew passwords, each at least 16 characters. Save them in your password manager.</p><form id="setupForm"><label>Administrator username<input id="adminUsername" value="admin" autocomplete="username" required></label><label>Administrator password<input id="adminPassword" type="password" minlength="16" maxlength="256" autocomplete="new-password" required></label><label>Shared crew username<input id="crewUsername" value="crew" required></label><label>Shared crew password<input id="crewPassword" type="password" minlength="16" maxlength="256" autocomplete="new-password" required></label><button id="setupButton">Save Logins</button><p id="setupMessage" role="status"></p></form></section></main><script src="/setup.js" defer></script></body></html>
