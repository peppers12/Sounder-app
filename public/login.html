<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3b70"><title>Sounder Crew Login</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#102236;font:16px system-ui,-apple-system,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,410px);background:white;border-radius:18px;box-shadow:0 10px 32px #16345220;padding:30px}h1{font-size:25px;margin:10px 0}p{color:#617183;line-height:1.5}label{display:block;margin-top:16px;font-weight:650}input{display:block;width:100%;font:inherit;padding:13px;margin-top:6px;border:1px solid #bdcbd9;border-radius:9px}button{width:100%;background:#0b3b70;color:white;border:0;border-radius:9px;font:700 17px system-ui;padding:14px;margin-top:24px;cursor:pointer}.error{color:#b42318;font-size:14px;margin-top:12px}small{display:block;margin-top:24px;color:#637386}</style></head>
<body><main class="card"><strong>SOUNDER CREW REPORT</strong><h1>Employee Sign In</h1><p>Sign in to access the crew reporting form.</p><form id="login"><label for="username">Username<input id="username" name="username" autocomplete="username" required></label><label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label><button id="submit">Sign In</button><div id="error" class="error" role="alert" aria-live="polite"></div></form><small>Independent reporting application — not connected to company systems.</small></main>
<script src="/login.js" defer></script></body></html>
